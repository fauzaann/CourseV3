spring.application.name=course-backend

# Koneksi Database
spring.datasource.url=jdbc:mysql://localhost:3306/course_db
spring.datasource.username=root
spring.datasource.password=

# Settingan Hibernate
# Ubah dari 'create' menjadi 'update' agar tidak menghapus tabel tiap kali restart
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Baris dialect di bawah ini dimatikan (diberi comment) karena Spring Boot 3
# sudah otomatis mendeteksi dialect MySQL, sehingga menghilangkan warning di log.
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.open-in-view=false

app.upload.dir=uploads/

server.port=8080

app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000