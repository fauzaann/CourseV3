<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daftar — LearnHub</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">
            <div class="logo">L</div>
            <span>LearnHub</span>
        </div>
        <h2>Buat Akun Baru</h2>
        <p class="subtitle">Bergabung dan mulai perjalanan belajarmu</p>

        <div id="alert" class="alert hidden"></div>

        <form id="registerForm">
            <div class="form-group">
                <label>Nama Lengkap</label>
                <input type="text" id="name" class="form-control" placeholder="Nama kamu" required />
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" class="form-control" placeholder="nama@email.com" required />
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="password-toggle">
                    <input type="password" id="password" class="form-control" placeholder="Min. 8 karakter" required
                           minlength="8" />
                    <button type="button" onclick="togglePwd('password')" title="Toggle">👁</button>
                </div>
            </div>
            <div class="form-group">
                <label>Konfirmasi Password</label>
                <div class="password-toggle">
                    <input type="password" id="confirmPassword" class="form-control" placeholder="Ulangi password"
                           required />
                    <button type="button" onclick="togglePwd('confirmPassword')" title="Toggle">👁</button>
                </div>
            </div>
            <div class="form-group">
                <label>Daftar sebagai</label>
                <select id="role" class="form-control">
                    <option value="STUDENT">Student — Ingin belajar</option>
                    <option value="INSTRUCTOR">Instructor — Ingin mengajar</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary w-full btn-lg" id="submitBtn">
                <span id="btnText">Daftar Sekarang</span>
                <span id="btnSpinner" class="spinner hidden"></span>
            </button>
        </form>

        <div class="auth-footer">
            Sudah punya akun? <a href="login.html">Masuk</a>
        </div>
        <div class="auth-footer mt-1">
            <a href="index.html">← Kembali ke Beranda</a>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script>
    if (Auth.isLoggedIn()) Auth.redirectByRole();

    function togglePwd(id) {
        const el = document.getElementById(id);
        el.type = el.type === 'password' ? 'text' : 'password';
    }

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const alertEl = document.getElementById('alert');
        const btn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const spinner = document.getElementById('btnSpinner');

        alertEl.className = 'alert hidden';

        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirmPassword').value;
        if (password !== confirm) {
            alertEl.textContent = 'Password dan konfirmasi password tidak cocok';
            alertEl.className = 'alert alert-error';
            return;
        }

        btn.disabled = true;
        btnText.textContent = 'Mendaftar...';
        spinner.classList.remove('hidden');

        try {
            await API.register({
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                password,
                role: document.getElementById('role').value,
                // Sesuaikan field dengan backend: username, fullName, dll.
            });

            alertEl.textContent = 'Akun berhasil dibuat! Mengarahkan ke halaman login...';
            alertEl.className = 'alert alert-success';
            setTimeout(() => window.location.href = 'login.html', 1800);
        } catch (err) {
            alertEl.textContent = err.message || 'Gagal mendaftar. Coba lagi.';
            alertEl.className = 'alert alert-error';
            btn.disabled = false;
            btnText.textContent = 'Daftar Sekarang';
            spinner.classList.add('hidden');
        }
    });
</script>
</body>

</html>
